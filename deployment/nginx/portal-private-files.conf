# Include inside the neon.flowguard.ng HTTPS server block, before other
# regex locations. This is a server configuration, not a website asset.
# Do not block /.well-known/ (certificate-validation paths).
location ~ /\.(?!well-known(?:/|$)) {
    return 404;
}

# Local authentication/test launchers must never be served by production.
location = /js/local-preview.js { return 404; }
location = /js/local-sandbox.js { return 404; }

autoindex off;
